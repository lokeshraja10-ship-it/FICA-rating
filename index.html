<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FICA Ratings</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<link rel="stylesheet" href="styles.css?v=fica-challenge-20260904-2" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body>

<div id="root">
  <div class="boot-loading">Loading board&hellip;</div>
</div>

<script>
  window.addEventListener('error', function (e) {
    var pre = document.createElement('pre');
    pre.className = 'boot-error';
    pre.textContent = 'JS ERROR:\n' + (e.message || 'unknown') +
      '\n\nFile: ' + (e.filename || '?') + '\nLine: ' + (e.lineno || '?') + ':' + (e.colno || '?');
    document.body.innerHTML = '';
    document.body.appendChild(pre);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
    var pre = document.createElement('pre');
    pre.className = 'boot-error';
    pre.textContent = 'PROMISE ERROR:\n' + msg;
    document.body.innerHTML = '';
    document.body.appendChild(pre);
  });
</script>

<script src="firebase.js?v=fica-challenge-20260904-2"></script>
<script src="app.js?v=fica-challenge-20260904-2"></script>
</body>
</html>
